<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Simulador educacional">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221410"/>
      <stop offset="1" stop-color="#1a100c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0c391"/>
      <stop offset="1" stop-color="#c8a96e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- textura sutil de pontos -->
  <g fill="#c8a96e" opacity="0.06">
    <circle cx="90" cy="70" r="3"/><circle cx="180" cy="140" r="2"/><circle cx="70" cy="240" r="2.5"/>
    <circle cx="150" cy="360" r="3"/><circle cx="260" cy="60" r="2"/><circle cx="700" cy="90" r="2.5"/>
    <circle cx="740" cy="220" r="3"/><circle cx="660" cy="380" r="2"/><circle cx="560" cy="430" r="2.5"/>
    <circle cx="320" cy="430" r="2"/><circle cx="60" cy="420" r="2"/><circle cx="760" cy="400" r="2"/>
  </g>

  <!-- cartas empilhadas (fichas de quiz) -->
  <g transform="translate(210 96) rotate(-6 190 144)">
    <rect x="26" y="34" width="380" height="252" rx="18" fill="#2a1a13" stroke="#c8a96e" stroke-opacity="0.25" stroke-width="2"/>
  </g>
  <g transform="translate(210 96) rotate(-2 190 144)">
    <rect x="13" y="17" width="380" height="252" rx="18" fill="#31201660" stroke="#c8a96e" stroke-opacity="0.35" stroke-width="2" fill-opacity="0.9"/>
  </g>
  <g transform="translate(210 96)">
    <rect x="0" y="0" width="380" height="252" rx="18" fill="#241611" stroke="url(#gold)" stroke-width="2.5"/>

    <!-- ponto de interroga��o -->
    <g transform="translate(96 126)">
      <path d="M -34 -42 Q -34 -78 0 -78 Q 36 -78 36 -46 Q 36 -24 12 -14 Q 0 -8 0 8"
            fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
      <circle cx="0" cy="44" r="9" fill="url(#gold)"/>
    </g>

    <!-- alternativas com checkmarks -->
    <g transform="translate(196 52)">
      <rect x="0" y="0" width="150" height="34" rx="10" fill="#c8a96e" fill-opacity="0.10" stroke="#c8a96e" stroke-opacity="0.3"/>
      <path d="M 14 17 l 7 8 l 13 -16" fill="none" stroke="#c8a96e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="13" width="88" height="8" rx="4" fill="#c8a96e" opacity="0.35"/>

      <rect x="0" y="56" width="150" height="34" rx="10" fill="#c8a96e" fill-opacity="0.22" stroke="url(#gold)" stroke-width="2"/>
      <path d="M 14 73 l 7 8 l 13 -16" fill="none" stroke="#e0c391" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="69" width="72" height="8" rx="4" fill="#e0c391" opacity="0.6"/>

      <rect x="0" y="112" width="150" height="34" rx="10" fill="#c8a96e" fill-opacity="0.10" stroke="#c8a96e" stroke-opacity="0.3"/>
      <circle cx="20" cy="129" r="7" fill="none" stroke="#c8a96e" stroke-width="3" opacity="0.5"/>
      <rect x="46" y="125" width="96" height="8" rx="4" fill="#c8a96e" opacity="0.35"/>
    </g>

    <!-- sigma sutil -->
    <text x="330" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#c8a96e" opacity="0.35">&#931;</text>
  </g>

  <!-- brilho inferior -->
  <ellipse cx="400" cy="486" rx="330" ry="60" fill="#c8a96e" opacity="0.05"/>
</svg>
